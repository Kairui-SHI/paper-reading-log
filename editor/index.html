<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阅读笔记 · 编辑室</title><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/editor/style.css"><link rel="stylesheet" href="/node_modules/katex/dist/katex.min.css"></head>
<body>
<header><a class="brand" href="https://kairui-shi.github.io/paper-reading-log/" target="_blank" rel="noopener"><img src="/assets/favicon.svg" alt="" width="32" height="32">阅读笔记 <small>编辑室</small></a><div class="actions"><span id="state" role="status">正在载入</span><button id="settings">发布设置</button><button id="save">保存草稿</button><button id="publish" class="primary">发布 ↗</button></div></header>
<div class="workspace">
<section class="daily-activities" aria-labelledby="daily-title"><strong id="daily-title">今日打卡</strong><time id="activity-date"></time><label><input id="activity-exercise" type="checkbox"> 已健身</label><label><input id="activity-piano" type="checkbox"> 已练琴</label><button id="activity-save" type="button">保存</button><button id="activity-publish" type="button">同步网站 ↗</button><span id="activity-state" role="status"></span></section>
<aside><div class="sidebar-heading"><span>我的阅读</span><button id="new" aria-label="新建笔记">＋ 新建</button></div><input id="search" type="search" placeholder="搜索关键词" aria-label="搜索笔记标题、标签和正文"><nav id="list" aria-label="笔记列表"></nav><p class="sidebar-footer">随手记下，再慢慢想明白。</p></aside>
<main><section class="compose"><div class="panel-heading"><span>01 / 写下想法</span><span>MARKDOWN</span></div><form id="metadata"><input id="title" placeholder="论文标题 / 今天的阅读" aria-label="标题" required><div class="fields"><label>阅读日期<input id="date" type="date" required></label><label>状态<select id="status"><option>阅读中</option><option>准备阅读</option><option>已读完</option></select></label></div><label>论文链接<input id="paper_url" type="url" placeholder="https://arxiv.org/abs/…"></label><details><summary>作者、标签和摘要</summary><label>作者<input id="authors"></label><label>标签（逗号分隔）<input id="tags"></label><label>一句话摘要<input id="summary"></label><label>代码链接<input id="code_url" type="url"></label></details></form><div class="toolbar"><button id="restore-note" type="button" title="备份当前文字，再恢复磁盘中保存的笔记">恢复已保存</button><button id="format-note" type="button" title="整理标题、列表与空行，保留原文">整理格式</button><button id="undo-format" type="button" disabled>撤销整理</button><button type="button" data-insert="## ">标题</button><button type="button" data-insert="**文字**" title="选中文字后加粗（Ctrl / ⌘ + B）">加粗</button><button type="button" data-insert="*文字*" title="选中文字后设为斜体">斜体</button><button type="button" data-insert="`代码`">行内代码</button><button type="button" data-insert="- ">列表</button><button type="button" data-insert="[文字](https://)">链接</button><button type="button" data-insert="![图片说明](https://)">图片</button><button type="button" data-insert="$$\nE = mc^2\n$$">公式</button></div><textarea id="body" aria-label="Markdown 正文" spellcheck="false" placeholder="从这里开始自由记录…"></textarea><div class="editor-footer"><span id="words">0 字</span><span>Ctrl / ⌘ + S 保存</span></div></section>
<section class="preview-panel"><div class="panel-heading"><span>02 / 阅读效果</span><span>LIVE PREVIEW</span></div><article id="preview"><p id="preview-meta"></p><h1 id="preview-title"></h1><p id="preview-summary"></p><div id="preview-body"></div></article></section></main>
</div>
<dialog id="settings-dialog"><h2>发布设置</h2><p>默认使用本机 Git 登录。也可以填写仅授权此仓库、具有 Contents 读写权限的 GitHub 令牌。令牌只保留在当前页面内存中，关闭后清除。</p><label>GitHub 令牌<input id="token" type="password" autocomplete="off" placeholder="可留空"></label><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">创建仓库专用令牌 ↗</a><button id="close-settings" class="primary">完成</button></dialog>
<script src="/node_modules/marked/lib/marked.umd.js"></script><script src="/node_modules/dompurify/dist/purify.min.js"></script><script src="/node_modules/katex/dist/katex.min.js"></script><script src="/node_modules/katex/dist/contrib/auto-render.min.js"></script><script src="/editor/format.js"></script><script src="/editor/app.js" defer></script>
</body></html>
