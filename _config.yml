title: Paper Reading Log
description: 每天读一点，长期留下一条清晰的研究轨迹。
lang: zh-CN
timezone: America/New_York
url: "https://kairui-shi.github.io"
baseurl: "/paper-reading-log"
markdown: kramdown
permalink: pretty

collections:
  notes:
    output: true
    permalink: /notes/:name/

defaults:
  - scope:
      path: ""
      type: notes
    values:
      layout: note

exclude:
  - editor
  - node_modules
  - package.json
  - package-lock.json
  - .editor-drafts
  - .editor-backups
  - README.md
  - templates
  - Gemfile
  - Gemfile.lock
